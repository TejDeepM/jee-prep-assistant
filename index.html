<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE 2026 Progress Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <canvas id="physics-canvas"></canvas>

    <div class="container">
        <header>
            <h1>JEE 2027 <span class="highlight">Tracker</span></h1>

            <div class="progress-overview">
                <div class="progress-card">
                    <span class="progress-label">Total Progress</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="total-progress"></div>
                    </div>
                    <span class="progress-text" id="total-text">0%</span>
                </div>
            </div>
        </header>

        <nav class="subject-tabs">
            <div class="active-indicator" id="active-indicator"></div>
            <button class="tab-btn active" data-subject="physics">Physics</button>
            <button class="tab-btn" data-subject="chemistry">Chemistry</button>
            <button class="tab-btn" data-subject="maths">Maths</button>
        </nav>

        <main id="chapter-list" class="chapter-list">
            <!-- Chapters will be injected here by JS -->
        </main>
    </div>



    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
